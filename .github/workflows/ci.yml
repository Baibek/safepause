name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r backend/requirements.txt pytest httpx
      - run: cd backend && python -m pytest -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: node --test frontend/src/call/detector.test.mjs frontend/src/transfer/words.test.mjs frontend/src/virtual/policy.test.mjs frontend/src/virtual/federated.test.mjs
      - run: cd frontend && npm ci && npm run test:engine && npm run build && npm run build:virtual
